name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  quality:
    name: Typecheck, build, and tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SKIP_DOCKER_POSTGRES: "1"
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/restaurant_orders_test
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/restaurant_orders_e2e
      AUTH_TOKEN_SECRET: ci-test-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Client unit tests
        run: npm run test:unit

      - name: API integration tests
        run: npm run test

      - name: Browser E2E tests
        run: npm run test:e2e
