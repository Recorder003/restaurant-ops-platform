services:
  postgres:
    image: postgres:16-alpine
    container_name: restaurant-orders-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: restaurant_orders
    ports:
      - "5432:5432"
    volumes:
      - restaurant_orders_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d restaurant_orders"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: restaurant-orders-redis
    ports:
      - "6379:6379"
    volumes:
      - restaurant_orders_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  restaurant_orders_data:
  restaurant_orders_redis_data:
